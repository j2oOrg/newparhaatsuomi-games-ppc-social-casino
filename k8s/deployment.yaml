apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrallion-coins-social-casino
  labels:
    app: centrallion-coins-social-casino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centrallion-coins-social-casino
  template:
    metadata:
      labels:
        app: centrallion-coins-social-casino
    spec:
      containers:
        - name: centrallion-coins-social-casino
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: centrallion-coins-social-casino
  labels:
    app: centrallion-coins-social-casino
spec:
  type: LoadBalancer
  selector:
    app: centrallion-coins-social-casino
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  loadBalancerIP: LOAD_BALANCER_IP_PLACEHOLDER
